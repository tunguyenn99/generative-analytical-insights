name: CI Pipeline & Data Quality Governance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Commit Hooks (Black & SQLFluff)
        run: |
          pre-commit run --all-files

      - name: Test dbt Models Compilation
        run: |
          cd zomato_dbt
          dbt compile
