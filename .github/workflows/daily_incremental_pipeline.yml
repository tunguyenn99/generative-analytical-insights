name: Daily Incremental Data Pipeline

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-incremental-ingestion:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily Incremental Random Data
        run: |
          python scripts/generate_daily_incremental_data.py

      - name: Load Raw Incremental Data to DuckDB
        run: |
          python scripts/load_raw_duckdb.py

      - name: Execute dbt Medallion Transformations & Tests
        run: |
          cd zomato_dbt
          dbt build --profiles-dir .

      - name: Execute AI LLM Review Enrichment & Observability
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai/enrich_reviews.py
          python scripts/data_observability.py

      - name: Commit & Push Updated DuckDB Database to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'cron(data): daily incremental data ingestion & warehouse refresh'
          branch: main
          file_pattern: 'data/warehouse/zomato_dw.duckdb data/observability/*'
          add_options: '-f'
